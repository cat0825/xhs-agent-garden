name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm check-format

      - name: Check types
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:run

      # Static export is the deployed artifact (Cloudflare Pages serves out/).
      - name: Build static export
        run: pnpm build:static
        env:
          SITE_URL: https://takina.xyz

      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/rss.xml
          test -f out/sitemap.xml
          posts=$(find out/posts -name index.html | wc -l | tr -d ' ')
          echo "exported posts: $posts"
          test "$posts" -gt 0
